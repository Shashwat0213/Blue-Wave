<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlueWave Music Tracker</title>
<style>
  :root {
    --bg: #061126;
    --panel: #0d2040;
    --blue: #168bff;
    --cyan: #55e5ff;
    --text: #f4f8ff;
    --muted: #a8bbd8;
    --line: #24436b;
    --accent: #168bff;
    --card: #0d2040;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Arial, sans-serif;
    background: radial-gradient(ellipse at top, #103a70, #061126 65%);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px; padding: 20px 6%; border-bottom: 1px solid #ffffff18; flex-wrap: wrap;
  }
  .logo { font-weight: 900; font-size: 24px; color: var(--cyan); }
  .logo span { color: var(--text); }
  .pill { border: 1px solid #2b6eaa; border-radius: 25px; padding: 7px 12px; font-size: 11px; color: var(--cyan); letter-spacing: 0.5px; }
  
  main { max-width: 1200px; margin: auto; padding: 10px 22px 120px; }
  .section { margin-bottom: 42px; }
  .section-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .section-head h2 { margin: 0 0 6px; font-size: 22px; }
  .section-head p { color: var(--muted); font-size: 13px; margin: 0; }
  
  .search-bar { max-width: 680px; margin: 0 0 20px; display: flex; gap: 10px; }
  input, select { padding: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; color: var(--text); font-size: 15px; outline: none; width: 100%; }
  .search-bar input { flex: 1; min-width: 0; }
  
  button { border: 0; border-radius: 10px; padding: 12px 18px; background: var(--blue); color: #fff; font-weight: bold; cursor: pointer; font-size: 13px; transition: 0.2s; }
  button:hover { background: #006ed9; }
  .btn-secondary { background: #17375e; border: 1px solid #365d87; color: var(--text); }
  .btn-secondary:hover { background: #1f4a7a; }
  .btn-sm { padding: 8px 12px; font-size: 12px; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .stat h3 { color: var(--muted); font-size: 12px; margin: 0 0 8px; text-transform: uppercase; }
  .stat strong { font-size: 28px; color: var(--cyan); }

  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 17px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 17px; overflow: hidden; cursor: pointer; transition: 0.2s; }
  .card:hover { transform: translateY(-4px); border-color: var(--cyan); box-shadow: 0 8px 24px #00000044; }
  .card img { width: 100%; height: 170px; object-fit: cover; background: #18365d; display: block; }
  .card .info { padding: 12px; }
  .card .info h3 { font-size: 15px; margin: 0 0 6px; }
  .card .info p { color: var(--muted); font-size: 12px; margin: 4px 0; }

  .song { display: flex; align-items: center; gap: 13px; padding: 13px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; transition: 0.2s; }
  .song:hover { border-color: var(--cyan); transform: translateX(3px); }
  .song.playing { border-color: var(--cyan); background: linear-gradient(135deg, rgba(22,139,255,.15), rgba(85,229,255,.08)); }
  .song img { width: 52px; height: 52px; border-radius: 9px; object-fit: cover; flex-shrink: 0; }
  .song-info { flex: 1; min-width: 0; }
  .song-info h4 { font-size: 14px; margin: 0 0 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song-info p { color: var(--muted); font-size: 12px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song-actions { display: flex; gap: 7px; }
  .song-actions button { padding: 8px; width: 34px; height: 34px; font-size: 14px; background: #17375e; border: 1px solid #365d87; display: grid; place-items: center; }
  .song-actions button:hover { background: var(--blue); border-color: var(--blue); }
  .song-actions .fav-btn.active { background: #ec4899; border-color: #ec4899; }
  .song-actions .mark-btn.done { background: #16a34a; border-color: #16a34a; }

  .empty { text-align: center; padding: 30px; color: var(--muted); font-size: 14px; background: var(--panel); border: 1px dashed var(--line); border-radius: 12px; }

  /* Sticky Bottom Player */
  .player-bar {
    position: fixed; bottom: 0; left: 0; right: 0; background: rgba(6, 17, 38, 0.95); backdrop-filter: blur(15px);
    border-top: 1px solid var(--line); padding: 12px 5%; display: flex; align-items: center; gap: 16px; z-index: 100;
    transform: translateY(100%); transition: transform 0.3s;
  }
  .player-bar.show { transform: translateY(0); }
  .player-info { display: flex; align-items: center; gap: 12px; min-width: 180px; max-width: 250px; }
  .player-info img { width: 45px; height: 45px; border-radius: 8px; object-fit: cover; }
  .player-info .text { min-width: 0; }
  .player-info h4 { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; }
  .player-info p { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  
  .player-controls { display: flex; align-items: center; gap: 8px; }
  .player-controls button { width: 36px; height: 36px; padding: 0; display: grid; place-items: center; background: transparent; border: 1px solid transparent; }
  .player-controls button:hover { background: #17375e; }
  .player-controls .play-main { background: var(--blue); width: 44px; height: 44px; font-size: 18px; }
  .player-controls .play-main:hover { background: #006ed9; }

  .player-progress { flex: 1; display: flex; align-items: center; gap: 10px; }
  .player-progress span { font-size: 11px; color: var(--muted); min-width: 35px; text-align: center; }
  .progress-track { flex: 1; height: 5px; background: #1c2542; border-radius: 3px; cursor: pointer; position: relative; }
  .progress-fill { height: 100%; width: 0%; background: var(--cyan); border-radius: 3px; transition: width 0.1s linear; }

  /* Themes */
  .themes { display: flex; flex-wrap: wrap; gap: 10px; }
  .color { width: 36px; height: 36px; border-radius: 50%; border: 2px solid #ffffff55; padding: 0; cursor: pointer; }
  .color:hover { transform: scale(1.15); }
  
  @media (max-width: 720px) {
    .player-bar { flex-wrap: wrap; padding: 10px 14px; gap: 10px; }
    .player-info { flex: 1; }
    .player-progress { flex: 100%; order: 3; }
    .gallery { grid-template-columns: repeat(2, 1fr); }
    .song { padding: 10px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">BLUE<span>WAVE</span> ♪</div>
  <div class="pill">MUSIC TRACKER</div>
</header>

<main>

  <!-- SEARCH -->
  <section class="section" style="margin-top: 20px;">
    <div class="search-bar">
      <input id="globalSearch" type="search" placeholder="Search any song or artist...">
      <button onclick="performSearch()">🔍 Search</button>
    </div>
  </section>

  <!-- DASHBOARD -->
  <section class="section">
    <div class="section-head"><div><h2>📊 Dashboard</h2><p>Your stats.</p></div></div>
    <div class="stats">
      <div class="stat"><h3>Total</h3><strong id="total">0</strong></div>
      <div class="stat"><h3>Listened</h3><strong id="listened">0</strong></div>
      <div class="stat"><h3>Favorites</h3><strong id="favCount">0</strong></div>
      <div class="stat"><h3>Playlists</h3><strong id="plCount">0</strong></div>
      <div class="stat"><h3>Progress</h3><strong id="progress">0%</strong></div>
    </div>
  </section>

  <!-- SEARCH RESULTS (Initially Hidden) -->
  <section class="section" id="searchSection" style="display:none;">
    <div class="section-head">
      <div><h2>🔍 Results</h2><p id="searchInfo">...</p></div>
      <button class="btn-secondary btn-sm" onclick="closeSearch()">✕ Close</button>
    </div>
    <div id="searchResults"></div>
  </section>

  <!-- ARTISTS -->
  <section class="section">
    <div class="section-head"><div><h2>🎤 Singers</h2><p>Click to load songs.</p></div></div>
    <div class="gallery" id="artists"></div>
  </section>

  <!-- SONGS -->
  <section class="section" id="songsSection" style="display:none;">
    <div class="section-head">
      <div><h2>🎶 <span id="songHeading">Songs</span></h2><p id="songSubheading"></p></div>
      <button class="btn-secondary btn-sm" onclick="closeSongs()">✕ Close</button>
    </div>
    <div id="songs"></div>
  </section>

  <!-- FAVORITES -->
  <section class="section">
    <div class="section-head"><div><h2>❤️ Favorites</h2></div></div>
    <div id="favorites"></div>
  </section>

  <!-- PLAYLISTS -->
  <section class="section">
    <div class="section-head"><div><h2>📂 Playlists</h2></div></div>
    <div class="search-bar" style="max-width: 400px; margin-bottom: 16px;">
      <input id="playlistName" placeholder="New playlist name...">
      <button onclick="createPlaylist()">＋ Create</button>
    </div>
    <div id="playlists"></div>
  </section>

</main>

<!-- PLAYER BAR -->
<div class="player-bar" id="playerBar">
  <div class="player-info">
    <img id="playerImg" src="https://placehold.co/100x100/1c2542/22d3ee?text=♪" alt="">
    <div class="text">
      <h4 id="playerTitle">Nothing playing</h4>
      <p id="playerArtist">—</p>
    </div>
  </div>
  <div class="player-controls">
    <button id="prevBtn" title="Previous">⏮</button>
    <button id="playPauseBtn" class="play-main" title="Play/Pause">▶</button>
    <button id="nextBtn" title="Next">⏭</button>
  </div>
  <div class="player-progress">
    <span id="currentTime">0:00</span>
    <div class="progress-track" id="progressTrack"><div class="progress-fill" id="progressFill"></div></div>
    <span id="duration">0:00</span>
  </div>
</div>

<!-- Hidden YouTube Player Container -->
<div id="ytHidden" style="position:absolute;width:0;height:0;overflow:hidden;"></div>

<script>
// ==========================================
// CONFIG (YOUR RENDER URL IS PASTED HERE)
// ==========================================
const BACKEND_URL = "https://blue-wave-axyu.onrender.com"; 

// ==========================================
// STORAGE & HELPERS
// ==========================================
const getData = (k, f) => { try { return JSON.parse(localStorage.getItem(k)) ?? f; } catch { return f; } };
const saveData = (k, v) => localStorage.setItem(k, JSON.stringify(v));
const esc = v => String(v||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));

let songs = getData("mt_songs", []);
let favorites = getData("mt_favorites", []);
let playlists = getData("mt_playlists", []);

let queue = [];
let queueIdx = -1;
let playingId = null;
let isPlaying = false;
let ytPlayer = null, ytReady = false;
let progressTimer = null;

// ==========================================
// YOUTUBE IFRAME PLAYER
// ==========================================
function loadYT() {
  if (window.YT && window.YT.Player) return onYTReady();
  const s = document.createElement("script");
  s.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(s);
}
window.onYouTubeIframeAPIReady = onYTReady;

function onYTReady() {
  ytPlayer = new YT.Player("ytPlayer", {
    height: "0", width: "0",
    playerVars: { autoplay: 0, controls: 0, disablekb: 1, fs: 0, modestbranding: 1, rel: 0 },
    events: {
      onReady: () => { ytReady = true; },
      onStateChange: onStateChange
    }
  });
}

function ensureYT() {
  if (ytPlayer && ytReady) return true;
  if (!document.getElementById("ytPlayer")) {
    const d = document.createElement("div");
    d.id = "ytPlayer";
    d.style.cssText = "position:absolute;width:0;height:0;overflow:hidden;";
    document.getElementById("ytHidden").appendChild(d);
    loadYT();
  }
  return false;
}

function onStateChange(e) {
  if (e.data === YT.PlayerState.ENDED) playNext();
  if (e.data === YT.PlayerState.PLAYING) {
    isPlaying = true;
    document.getElementById("playPauseBtn").textContent = "⏸";
    startProgress();
    autoMarkListened();
  }
  if (e.data === YT.PlayerState.PAUSED) {
    isPlaying = false;
    document.getElementById("playPauseBtn").textContent = "▶";
  }
}

function startProgress() {
  clearInterval(progressTimer);
  progressTimer = setInterval(() => {
    if (!ytPlayer || !ytReady || !ytPlayer.getCurrentTime) return;
    const cur = ytPlayer.getCurrentTime() || 0;
    const dur = ytPlayer.getDuration() || 0;
    document.getElementById("currentTime").textContent = fmt(cur);
    document.getElementById("duration").textContent = fmt(dur);
    if (dur > 0) document.getElementById("progressFill").style.width = (cur / dur * 100) + "%";
  }, 400);
}

function fmt(s) {
  if (!s || isNaN(s)) return "0:00";
  const m = Math.floor(s/60), sec = Math.floor(s%60);
  return m + ":" + (sec < 10 ? "0" : "") + sec;
}

// ==========================================
// API SEARCH & PLAY
// ==========================================
async function searchYouTube(query) {
  try {
    const res = await fetch(`${BACKEND_URL}/api/search?q=${encodeURIComponent(query)}`);
    const data = await res.json();
    return data.results || [];
  } catch (e) {
    alert("Search failed. Please check your internet or backend server.");
    return [];
  }
}

async function playVideo(videoId, title, artist, thumbnail) {
  if (!ensureYT()) {
    setTimeout(() => playVideo(videoId, title, artist, thumbnail), 700);
    return;
  }

  document.getElementById("playerTitle").textContent = title;
  document.getElementById("playerArtist").textContent = artist;
  document.getElementById("playerImg").src = thumbnail || "https://placehold.co/100x100/1c2542/22d3ee?text=♪";
  document.getElementById("playerBar").classList.add("show");

  ytPlayer.loadVideoById(videoId);
  playingId = videoId;
  
  document.querySelectorAll(".song").forEach(el => {
    el.classList.toggle("playing", el.dataset.id === videoId);
  });

  const existing = songs.find(s => s.videoId === videoId);
  if (!existing) {
    songs.push({ id: videoId, videoId, name: title, artist, image: thumbnail, listened: false });
    saveData("mt_songs", songs);
  }
  updateDashboard();
}

function autoMarkListened() {
  if (!playingId) return;
  const s = songs.find(x => x.videoId === playingId);
  if (s && !s.listened) {
    s.listened = true;
    saveData("mt_songs", songs);
    updateDashboard();
  }
}

// ==========================================
// SEARCH UI
// ==========================================
async function performSearch() {
  const q = document.getElementById("globalSearch").value.trim();
  if (!q) return alert("Type something to search");

  document.getElementById("searchSection").style.display = "block";
  document.getElementById("searchInfo").textContent = "Searching...";
  document.getElementById("searchResults").innerHTML = '<div class="empty">⏳ Searching YouTube...</div>';
  document.getElementById("searchSection").scrollIntoView({ behavior: "smooth" });

  const results = await searchYouTube(q);
  if (!results.length) {
    document.getElementById("searchResults").innerHTML = '<div class="empty">No results found.</div>';
    document.getElementById("searchInfo").textContent = "0 results";
    return;
  }

  document.getElementById("searchInfo").textContent = `${results.length} results for "${q}"`;
  const mapped = results.map(r => ({
    videoId: r.videoId,
    trackName: r.title,
    artistName: r.channel,
    artworkUrl100: r.thumbnail
  }));
  
  queue = mapped;
  renderSongList(mapped, "searchResults");
}

function closeSearch() {
  document.getElementById("searchSection").style.display = "none";
}

// ==========================================
// ARTISTS UI
// ==========================================
const featuredArtists = [
  { name: "Arijit Singh", genre: "Playback", img: "https://ui-avatars.com/api/?name=Arijit+Singh&size=400&background=1a2a5a&color=22d3ee" },
  { name: "Shreya Ghoshal", genre: "Playback", img: "https://ui-avatars.com/api/?name=Shreya+Ghoshal&size=400&background=43216f&color=ffffff" },
  { name: "Sonu Nigam", genre: "Playback", img: "https://ui-avatars.com/api/?name=Sonu+Nigam&size=400&background=174d72&color=ffffff" },
  { name: "Lata Mangeshkar", genre: "Legend", img: "https://ui-avatars.com/api/?name=Lata+Mangeshkar&size=400&background=67452b&color=ffffff" },
  { name: "Atif Aslam", genre: "Playback", img: "https://ui-avatars.com/api/?name=Atif+Aslam&size=400&background=185d70&color=ffffff" },
  { name: "Neha Kakkar", genre: "Playback", img: "https://ui-avatars.com/api/?name=Neha+Kakkar&size=400&background=70336b&color=ffffff" }
];

function renderArtists() {
  const box = document.getElementById("artists");
  box.innerHTML = featuredArtists.map(a => `
    <article class="card" data-artist="${esc(a.name)}">
      <img src="${esc(a.img)}" alt="${esc(a.name)}" loading="lazy">
      <div class="info">
        <h3>${esc(a.name)}</h3>
        <p>${esc(a.genre)}</p>
      </div>
    </article>
  `).join("");

  box.querySelectorAll(".card").forEach(card => {
    card.onclick = () => loadArtistSongs(card.dataset.artist);
  });
}

async function loadArtistSongs(artistName) {
  document.getElementById("songsSection").style.display = "block";
  document.getElementById("songHeading").textContent = "Songs by " + artistName;
  document.getElementById("songSubheading").textContent = "Loading from YouTube...";
  document.getElementById("songs").innerHTML = '<div class="empty">⏳ Fetching songs...</div>';
  document.getElementById("songsSection").scrollIntoView({ behavior: "smooth" });

  const results = await searchYouTube(artistName + " best songs");
  if (!results.length) {
    document.getElementById("songs").innerHTML = '<div class="empty">No songs found.</div>';
    return;
  }

  document.getElementById("songSubheading").textContent = `${results.length} songs found`;
  const mapped = results.map(r => ({
    videoId: r.videoId,
    trackName: r.title,
    artistName: r.channel,
    artworkUrl100: r.thumbnail
  }));
  
  queue = mapped;
  renderSongList(mapped, "songs");
}

function closeSongs() {
  document.getElementById("songsSection").style.display = "none";
}

// ==========================================
// RENDER SONG LIST (Common for Search & Artist)
// ==========================================
function renderSongList(list, containerId) {
  const box = document.getElementById(containerId);
  box.innerHTML = "";
  
  if (!list.length) {
    box.innerHTML = '<div class="empty">No songs to show.</div>';
    return;
  }

  list.forEach((s, i) => {
    const id = s.videoId;
    const saved = songs.find(x => x.videoId === id);
    const isFav = favorites.includes(id);
    const listened = saved?.listened || false;

    const row = document.createElement("div");
    row.className = "song" + (playingId === id ? " playing" : "");
    row.dataset.id = id;
    row.innerHTML = `
      <img src="${esc(s.artworkUrl100 || 'https://placehold.co/100x100/1c2542/22d3ee?text=♪')}" alt="" loading="lazy">
      <div class="song-info">
        <h4>${esc(s.trackName)}</h4>
        <p>${esc(s.artistName)}${listened ? ' · ✓ Listened' : ''}</p>
      </div>
      <div class="song-actions">
        <button class="play-btn" title="Play">▶</button>
        <button class="fav-btn ${isFav ? 'active' : ''}" title="Favorite">${isFav ? '❤️' : '♡'}</button>
        <button class="mark-btn ${listened ? 'done' : ''}" title="Mark listened">✓</button>
      </div>
    `;

    row.querySelector(".play-btn").onclick = () => {
      queue = list; queueIdx = i;
      playVideo(s.videoId, s.trackName, s.artistName, s.artworkUrl100);
    };

    row.querySelector(".fav-btn").onclick = () => {
      toggleFav(id, s);
      renderSongList(list, containerId);
      renderFavorites();
    };

    row.querySelector(".mark-btn").onclick = () => {
      const found = songs.find(x => x.videoId === id);
      if (found) { found.listened = true; }
      else { songs.push({ id, videoId: id, name: s.trackName, artist: s.artistName, image: s.artworkUrl100, listened: true }); }
      saveData("mt_songs", songs);
      renderSongList(list, containerId);
      updateDashboard();
    };

    box.appendChild(row);
  });
}

// ==========================================
// FAVORITES & PLAYLISTS
// ==========================================
function toggleFav(id, songData) {
  if (favorites.includes(id)) {
    favorites = favorites.filter(x => x !== id);
  } else {
    favorites.push(id);
    if (!songs.find(x => x.videoId === id)) {
      songs.push({ id, videoId: id, name: songData.trackName, artist: songData.artistName, image: songData.artworkUrl100, listened: false });
      saveData("mt_songs", songs);
    }
  }
  saveData("mt_favorites", favorites);
  updateDashboard();
}

function renderFavorites() {
  const box = document.getElementById("favorites");
  const items = songs.filter(s => favorites.includes(s.videoId || s.id));
  
  if (!items.length) {
    box.innerHTML = '<div class="empty">No favorites yet. Tap ♡ to save.</div>';
    return;
  }

  box.innerHTML = "";
  items.forEach(s => {
    const row = document.createElement("div");
    row.className = "song";
    row.innerHTML = `
      <img src="${esc(s.image)}" alt="">
      <div class="song-info"><h4>${esc(s.name)}</h4><p>${esc(s.artist)}</p></div>
      <div class="song-actions">
        <button class="play-btn">▶</button>
        <button class="fav-btn active">❤️</button>
      </div>
    `;
    row.querySelector(".play-btn").onclick = () => playVideo(s.videoId, s.name, s.artist, s.image);
    row.querySelector(".fav-btn").onclick = () => { toggleFav(s.videoId); renderFavorites(); };
    box.appendChild(row);
  });
}

function createPlaylist() {
  const inp = document.getElementById("playlistName");
  const name = inp.value.trim();
  if (!name) return;
  playlists.push({ id: Date.now(), name, songs: [] });
  saveData("mt_playlists", playlists);
  inp.value = "";
  renderPlaylists();
  updateDashboard();
}

function renderPlaylists() {
  const box = document.getElementById("playlists");
  if (!playlists.length) {
    box.innerHTML = '<div class="empty">No playlists yet.</div>';
    return;
  }
  box.innerHTML = "";
  playlists.forEach(pl => {
    const card = document.createElement("div");
    card.style = "background: var(--panel); padding: 15px; border-radius: 12px; margin-bottom: 10px; border: 1px solid var(--line);";
    card.innerHTML = `
      <h3>${esc(pl.name)}</h3>
      <p style="color:var(--muted); font-size:12px; margin-top:4px;">${pl.songs.length} songs</p>
      <button class="btn-secondary btn-sm" style="margin-top:10px;" onclick="deletePlaylist(${pl.id})">Delete</button>
    `;
    box.appendChild(card);
  });
}

function deletePlaylist(id) {
  playlists = playlists.filter(p => p.id !== id);
  saveData("mt_playlists", playlists);
  renderPlaylists();
  updateDashboard();
}

// ==========================================
// PLAYER CONTROLS & UTILS
// ==========================================
document.getElementById("playPauseBtn").onclick = () => {
  if (!ytPlayer || !ytReady) return;
  if (isPlaying) ytPlayer.pauseVideo(); else ytPlayer.playVideo();
};

document.getElementById("nextBtn").onclick = () => playNext();
document.getElementById("prevBtn").onclick = () => {
  if (!queue.length) return;
  queueIdx = (queueIdx - 1 + queue.length) % queue.length;
  const s = queue[queueIdx];
  playVideo(s.videoId, s.trackName || s.name, s.artistName || s.artist, s.artworkUrl100 || s.image);
};

function playNext() {
  if (!queue.length) return;
  queueIdx = (queueIdx + 1) % queue.length;
  const s = queue[queueIdx];
  playVideo(s.videoId, s.trackName || s.name, s.artistName || s.artist, s.artworkUrl100 || s.image);
}

document.getElementById("progressTrack").onclick = (e) => {
  if (!ytPlayer || !ytReady) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  ytPlayer.seekTo(pct * ytPlayer.getDuration(), true);
};

function updateDashboard() {
  const total = songs.length;
  const listened = songs.filter(s => s.listened).length;
  document.getElementById("total").textContent = total;
  document.getElementById("listened").textContent = listened;
  document.getElementById("favCount").textContent = favorites.length;
  document.getElementById("plCount").textContent = playlists.length;
  document.getElementById("progress").textContent = total ? Math.round(listened / total * 100) + "%" : "0%";
}

// ==========================================
// INITIALIZE APP
// ==========================================
renderArtists();
renderFavorites();
renderPlaylists();
updateDashboard();
loadYT(); // Load hidden YouTube Player

// Enter key to search
document.getElementById("globalSearch").addEventListener("keydown", e => {
  if (e.key === "Enter") performSearch();
});
</script>

</body>
