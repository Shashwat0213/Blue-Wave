<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>BlueWave Music - Pro</title>
<style>
  :root {
    --bg: #000000;
    --surface: #121212;
    --surface-hover: #1f1f1f;
    --blue: #3b82f6;
    --cyan: #22d3ee;
    --text: #ffffff;
    --muted: #aaaaaa;
    --line: #333333;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  body {
    background-color: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    padding-bottom: 100px; /* Player ke liye jagah */
  }

  /* HEADER */
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px);
    display: flex; align-items: center; justify-content: space-between;
    padding: 15px 20px;
  }
  .logo { font-size: 22px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .logo span { color: var(--cyan); }
  
  .search-bar {
    flex: 1; max-width: 500px; margin: 0 20px;
    display: flex; align-items: center; background: var(--surface);
    border-radius: 30px; padding: 8px 15px; border: 1px solid var(--line);
  }
  .search-bar input {
    flex: 1; background: transparent; border: none; color: white;
    font-size: 15px; outline: none; margin-left: 10px;
  }
  .search-bar button { background: var(--blue); border: none; color: white; padding: 8px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; }

  /* MAIN CONTENT */
  main { max-width: 1200px; margin: 80px auto 0; padding: 0 20px; }
  
  /* HORIZONTAL SCROLL SECTIONS */
  .section-title { font-size: 20px; font-weight: 700; margin: 30px 0 15px; }
  .h-scroll {
    display: flex; gap: 15px; overflow-x: auto; scroll-behavior: smooth;
    padding-bottom: 15px; scrollbar-width: none; /* Firefox */
  }
  .h-scroll::-webkit-scrollbar { display: none; } /* Chrome */

  /* MUSIC CARD (Screenshot Style) */
  .card {
    width: 160px; flex-shrink: 0; cursor: pointer; transition: transform 0.2s;
    background: var(--surface); border-radius: 8px; padding: 10px;
  }
  .card:hover { background: var(--surface-hover); transform: translateY(-3px); }
  .card-img-wrapper { position: relative; width: 100%; aspect-ratio: 1; margin-bottom: 10px; border-radius: 6px; overflow: hidden; }
  .card img { width: 100%; height: 100%; object-fit: cover; }
  .card h4 { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
  .card p { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* PLAY OVERLAY ON CARD */
  .play-overlay {
    position: absolute; bottom: 8px; right: 8px; width: 40px; height: 40px;
    background: var(--blue); border-radius: 50%; display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 0.2s, transform 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    transform: translateY(10px);
  }
  .card:hover .play-overlay { opacity: 1; transform: translateY(0); }

  /* SONG LIST (Search Results) */
  .song-list { display: flex; flex-direction: column; gap: 5px; }
  .song-row {
    display: flex; align-items: center; gap: 15px; padding: 10px;
    border-radius: 8px; cursor: pointer; transition: 0.2s;
  }
  .song-row:hover { background: var(--surface-hover); }
  .song-row.playing { background: rgba(59, 130, 246, 0.15); border: 1px solid rgba(59,130,246,0.3); }
  .song-row img { width: 50px; height: 50px; border-radius: 5px; object-fit: cover; }
  .song-info { flex: 1; min-width: 0; }
  .song-info h4 { font-size: 15px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song-info p { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  
  .action-btns { display: flex; gap: 10px; }
  .action-btns button, .action-btns a {
    background: transparent; border: none; color: var(--muted); font-size: 18px;
    cursor: pointer; padding: 5px; transition: 0.2s; text-decoration: none;
  }
  .action-btns button:hover, .action-btns a:hover { color: white; transform: scale(1.1); }
  .action-btns .fav-btn.active { color: #ec4899; }

  /* BOTTOM PLAYER */
  .player-bar {
    position: fixed; bottom: 0; left: 0; right: 0; background: #181818;
    border-top: 1px solid var(--line); padding: 12px 20px;
    display: flex; align-items: center; justify-content: space-between; gap: 20px;
    z-index: 200; transform: translateY(100%); transition: transform 0.3s;
  }
  .player-bar.show { transform: translateY(0); }
  
  .player-left { display: flex; align-items: center; gap: 15px; width: 30%; min-width: 200px; }
  .player-left img { width: 50px; height: 50px; border-radius: 5px; object-fit: cover; }
  .player-left h4 { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player-left p { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .player-center { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .controls { display: flex; align-items: center; gap: 20px; }
  .controls button { background: transparent; border: none; color: white; font-size: 20px; cursor: pointer; transition: 0.2s; }
  .controls button:hover { color: var(--cyan); }
  .controls .play-main { background: white; color: black; width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .controls .play-main:hover { transform: scale(1.1); color: black; }

  .progress-container { width: 100%; max-width: 500px; display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--muted); }
  .progress-track { flex: 1; height: 4px; background: #444; border-radius: 2px; cursor: pointer; position: relative; }
  .progress-fill { height: 100%; width: 0%; background: white; border-radius: 2px; }
  .progress-track:hover .progress-fill { background: var(--cyan); }

  .player-right { width: 30%; display: flex; justify-content: flex-end; align-items: center; gap: 10px; }
  
  /* LOADING OVERLAY */
  .spinner-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 999; flex-direction: column; gap: 15px; color: var(--cyan); font-weight: bold;}
  .spinner { width: 40px; height: 40px; border: 4px solid rgba(85,229,255,0.3); border-top-color: var(--cyan); border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { 100% { transform: rotate(360deg); } }

  /* MOBILE RESPONSIVE */
  @media (max-width: 768px) {
    header { padding: 10px; flex-wrap: wrap; }
    .search-bar { margin: 10px 0 0; max-width: 100%; order: 3; width: 100%; }
    main { margin-top: 110px; padding: 0 15px; }
    .card { width: 130px; }
    .player-bar { flex-wrap: wrap; padding: 10px; gap: 10px; }
    .player-left { width: calc(100% - 150px); }
    .player-center { width: 100%; order: 3; }
    .player-right { width: 120px; }
  }
</style>
</head>
<body>

<div class="spinner-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <p>Server se connect ho raha hai...</p>
</div>

<header>
  <div class="logo">♪ BLUE<span>WAVE</span></div>
  <div class="search-bar">
    <span>🔍</span>
    <input id="globalSearch" type="text" placeholder="Search songs, artists...">
    <button onclick="performSearch()">Search</button>
  </div>
</header>

<main>
  <!-- SEARCH RESULTS SECTION -->
  <div id="searchSection" style="display: none; margin-top: 20px;">
    <h2 class="section-title">Search Results</h2>
    <div class="song-list" id="searchResults"></div>
  </div>

  <!-- HOME SECTIONS (Show when not searching) -->
  <div id="homeSections">
    <!-- Quick Picks -->
    <h2 class="section-title">Quick picks</h2>
    <div class="h-scroll" id="quickPicks"></div>

    <!-- Trending -->
    <h2 class="section-title">Trending songs for you</h2>
    <div class="h-scroll" id="trendingSongs"></div>

    <!-- Top Artists -->
    <h2 class="section-title">Top Artists</h2>
    <div class="h-scroll" id="topArtists"></div>
  </div>
</main>

<!-- BOTTOM PLAYER -->
<div class="player-bar" id="playerBar">
  <div class="player-left">
    <img id="playerImg" src="https://placehold.co/100x100/121212/ffffff?text=♪" alt="">
    <div>
      <h4 id="playerTitle">Song Title</h4>
      <p id="playerArtist">Artist Name</p>
    </div>
  </div>
  
  <div class="player-center">
    <div class="controls">
      <button id="prevBtn">⏮</button>
      <button id="playPauseBtn" class="play-main">▶</button>
      <button id="nextBtn">⏭</button>
    </div>
    <div class="progress-container">
      <span id="currentTime">0:00</span>
      <div class="progress-track" id="progressTrack"><div class="progress-fill" id="progressFill"></div></div>
      <span id="duration">0:00</span>
    </div>
  </div>

  <div class="player-right">
    <span>🔊</span>
    <input type="range" id="volumeBar" min="0" max="100" value="100" style="width: 80px; accent-color: white;">
  </div>
</div>

<!-- Hidden YouTube Player -->
<div id="video-container" style="position:fixed; bottom:-9999px; left:-9999px; width:300px; height:300px;">
  <div id="ytPlayer"></div>
</div>

<script>
// ==========================================
// CONFIG & STATE
// ==========================================
const BACKEND_URL = "https://blue-wave-axyu.onrender.com"; 
const getData = (k, f) => { try { return JSON.parse(localStorage.getItem(k)) ?? f; } catch { return f; } };
const saveData = (k, v) => localStorage.setItem(k, JSON.stringify(v));
const esc = v => String(v||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));

let songs = getData("mt_songs", []);
let favorites = getData("mt_favorites", []);
let queue = [];
let queueIdx = -1;
let playingId = null;
let isPlaying = false;
let ytPlayer = null, ytReady = false;
let progressTimer = null;
let pendingVideo = null; 

const loadingOverlay = document.getElementById("loadingOverlay");

// ==========================================
// AUTO-PING (RENDER SERVER KO JAGAYE RAKHNE KE LIYE)
// ==========================================
function wakeUpServer() {
  fetch(BACKEND_URL).catch(()=>{});
}
wakeUpServer(); // Start hote hi ek baar
setInterval(wakeUpServer, 10 * 60 * 1000); // Har 10 minute me jagayega

// ==========================================
// YOUTUBE PLAYER SETUP
// ==========================================
function loadYT() {
  if (window.YT && window.YT.Player) { onYTReady(); return; }
  const s = document.createElement("script");
  s.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(s);
}
window.onYouTubeIframeAPIReady = onYTReady;

function onYTReady() {
  if(ytPlayer) return;
  ytPlayer = new YT.Player("ytPlayer", {
    height: "300", width: "300",
    playerVars: { autoplay: 0, controls: 1, origin: window.location.origin, enablejsapi: 1 },
    events: {
      onReady: () => { 
        ytReady = true; 
        if (pendingVideo) { playVideo(pendingVideo.videoId, pendingVideo.title, pendingVideo.artist, pendingVideo.thumbnail); pendingVideo = null; }
      },
      onStateChange: (e) => {
        if (e.data === YT.PlayerState.ENDED) { playNext(); }
        if (e.data === YT.PlayerState.PLAYING) {
          isPlaying = true;
          document.getElementById("playPauseBtn").textContent = "⏸";
          startProgress();
        }
        if (e.data === YT.PlayerState.PAUSED) {
          isPlaying = false;
          document.getElementById("playPauseBtn").textContent = "▶";
        }
      }
    }
  });
}

function startProgress() {
  clearInterval(progressTimer);
  progressTimer = setInterval(() => {
    if (!ytPlayer || !ytReady || !ytPlayer.getCurrentTime) return;
    const cur = ytPlayer.getCurrentTime() || 0;
    const dur = ytPlayer.getDuration() || 0;
    document.getElementById("currentTime").textContent = fmt(cur);
    document.getElementById("duration").textContent = fmt(dur);
    if (dur > 0) document.getElementById("progressFill").style.width = (cur / dur * 100) + "%";
  }, 500);
}
function fmt(s) { if (!s || isNaN(s)) return "0:00"; const m = Math.floor(s/60), sec = Math.floor(s%60); return m + ":" + (sec < 10 ? "0" : "") + sec; }

async function playVideo(videoId, title, artist, thumbnail) {
  if (!ytPlayer || !ytReady) {
    pendingVideo = { videoId, title, artist, thumbnail };
    loadYT(); return;
  }
  document.getElementById("playerTitle").textContent = title;
  document.getElementById("playerArtist").textContent = artist;
  document.getElementById("playerImg").src = thumbnail || "https://placehold.co/100x100/121212/ffffff?text=♪";
  document.getElementById("playerBar").classList.add("show");
  
  ytPlayer.loadVideoById(videoId);
  playingId = videoId;
  document.querySelectorAll(".song-row").forEach(el => el.classList.toggle("playing", el.dataset.id === videoId));
}

document.getElementById("playPauseBtn").onclick = () => {
  if (!ytPlayer || !ytReady) return;
  if (isPlaying) ytPlayer.pauseVideo(); else ytPlayer.playVideo();
};
document.getElementById("nextBtn").onclick = () => playNext();
document.getElementById("prevBtn").onclick = () => {
  if (!queue.length) return; queueIdx = (queueIdx - 1 + queue.length) % queue.length;
  const s = queue[queueIdx]; playVideo(s.videoId, s.trackName || s.name, s.artistName || s.artist, s.artworkUrl100 || s.image);
};
function playNext() {
  if (!queue.length) return; queueIdx = (queueIdx + 1) % queue.length;
  const s = queue[queueIdx]; playVideo(s.videoId, s.trackName || s.name, s.artistName || s.artist, s.artworkUrl100 || s.image);
}

document.getElementById("progressTrack").onclick = (e) => {
  if (!ytPlayer || !ytReady) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  ytPlayer.seekTo(pct * ytPlayer.getDuration(), true);
};
document.getElementById("volumeBar").oninput = (e) => {
  if (ytPlayer && ytReady) ytPlayer.setVolume(e.target.value);
};

// ==========================================
// SEARCH FUNCTION
// ==========================================
async function performSearch() {
  const q = document.getElementById("globalSearch").value.trim();
  if (!q) return;
  
  loadingOverlay.style.display = "flex";
  document.getElementById("homeSections").style.display = "none";
  document.getElementById("searchSection").style.display = "block";

  try {
    const res = await fetch(`${BACKEND_URL}/api/search?q=${encodeURIComponent(q)}`);
    const data = await res.json();
    
    loadingOverlay.style.display = "none";

    if (!data.results || !data.results.length) {
      document.getElementById("searchResults").innerHTML = '<div style="color:#aaa; padding:20px;">No results found.</div>'; return;
    }

    const mapped = data.results.map(r => ({ videoId: r.videoId, trackName: r.title, artistName: r.channel, artworkUrl100: r.thumbnail }));
    queue = mapped;
    renderList(mapped, "searchResults");
  } catch (e) {
    loadingOverlay.style.display = "none";
    alert("Search failed. Server so raha hai, thodi der baad try karein.");
  }
}

// ==========================================
// RENDER LISTS
// ==========================================
function renderList(list, containerId) {
  const box = document.getElementById(containerId);
  box.innerHTML = "";
  list.forEach((s, i) => {
    const id = s.videoId;
    const isFav = favorites.includes(id);
    const dlUrl = `https://pagalworld.is/search?q=${encodeURIComponent(s.trackName)}`;
    
    const row = document.createElement("div");
    row.className = "song-row" + (playingId === id ? " playing" : "");
    row.dataset.id = id;
    row.innerHTML = `
      <img src="${esc(s.artworkUrl100)}" alt="">
      <div class="song-info">
        <h4>${esc(s.trackName)}</h4>
        <p>${esc(s.artistName)}</p>
      </div>
      <div class="action-btns">
        <button class="fav-btn ${isFav ? 'active' : ''}">${isFav ? '❤️' : '🤍'}</button>
        <a href="${dlUrl}" target="_blank">⬇</a>
      </div>
    `;
    row.querySelector(".fav-btn").onclick = (e) => {
      e.stopPropagation();
      if(favorites.includes(id)) favorites = favorites.filter(x => x !== id);
      else favorites.push(id);
      saveData("mt_favorites", favorites); renderList(list, containerId);
    };
    row.onclick = () => {
      queue = list; queueIdx = i; playVideo(s.videoId, s.trackName, s.artistName, s.artworkUrl100);
    };
    box.appendChild(row);
  });
}

function renderCardList(list, containerId) {
  const box = document.getElementById(containerId);
  box.innerHTML = "";
  list.forEach((s, i) => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="card-img-wrapper">
        <img src="${esc(s.artworkUrl100)}" alt="">
        <div class="play-overlay">▶</div>
      </div>
      <h4>${esc(s.trackName)}</h4>
      <p>${esc(s.artistName)}</p>
    `;
    card.onclick = () => {
      queue = list; queueIdx = i; playVideo(s.videoId, s.trackName, s.artistName, s.artworkUrl100);
    };
    box.appendChild(card);
  });
}

// ==========================================
// HOME PAGE CONTENT (Aapke Screenshot Jaisa)
// ==========================================
const quickPicksData = [
  { videoId: "Umqb9KENgmk", trackName: "Mere Mehboob", artistName: "KID Boi", artworkUrl100: "https://is1-ssl.mzstatic.com/image/thumb/Music122/v4/9a/8b/7c/9a8b7c6d-5e4f-3a2b-1c0d-9e8f7a6b5c4d/886446789013.jpg/400x400bb.jpg" },
  { videoId: "BddP6PYo2gs", trackName: "Shiv Shiv Shankar", artistName: "Nikhar Juneja", artworkUrl100: "https://is1-ssl.mzstatic.com/image/thumb/Music112/v4/2c/3d/4e/2c3d4e5f-6a7b-8c9d-0e1f-2a3b4c5d6e7f/886446789014.jpg/400x400bb.jpg" },
  { videoId: "7Ii7l6y7c3U", trackName: "Jai Bajrang", artistName: "Rapperiya Baalam", artworkUrl100: "https://is1-ssl.mzstatic.com/image/thumb/Music122/v4/3d/4e/5f/3d4e5f6a-7b8c-9d0e-1f2a-3b4c5d6e7f8a/886446789015.jpg/400x400bb.jpg" },
  { videoId: "W5jrRf4Lw2s", trackName: "Rage Of Kali", artistName: "Raanjha", artworkUrl100: "https://is1-ssl.mzstatic.com/image/thumb/Music112/v4/4e/5f/6a/4e5f6a7b-8c9d-0e1f-2a3b-4c5d6e7f8a9b/886446789016.jpg/400x400bb.jpg" },
];

const trendingData = [
  { videoId: "284Ov7ysmfA", trackName: "Kanchi Keri", artistName: "Rapperiya Baalam", artworkUrl100: "https://is1-ssl.mzstatic.com/image/thumb/Music122/v4/5f/6a/7b/5f6a7b8c-9d0e-1f2a-3b4c-5d6e7f8a9b0c/886446789017.jpg/400x400bb.jpg" },
  { videoId: "ElZfdU54Cp8", trackName: "So Swaag", artistName: "Yo Yo", artworkUrl100: "https://is1-ssl.mzstatic.com/image/thumb/Music112/v4/6a/7b/8c/6a7b8c9d-0e1f-2a3b-4c5d-6e7f8a9b0c1d/886446789018.jpg/400x400bb.jpg" },
  { videoId: "BddP6PYo2gs", trackName: "Duvidha 2", artistName: "Allows Music", artworkUrl100: "https://is1-ssl.mzstatic.com/image/thumb/Music122/v4/9a/8b/7c/9a8b7c6d-5e4f-3a2b-1c0d-9e8f7a6b5c4d/886446789013.jpg/400x400bb.jpg" },
  { videoId: "7Ii7l6y7c3U", trackName: "Replay Mix", artistName: "Mix", artworkUrl100: "https://is1-ssl.mzstatic.com/image/thumb/Music112/v4/1b/1b/5a/1b1b5a1f-8635-8798-7215-2c2a4e0f7e1b/886446789012.jpg/400x400bb.jpg" }
];

const artistData = [
  { name: "Arijit Singh", genre: "Playback", img: "https://is1-ssl.mzstatic.com/image/thumb/Music112/v4/1b/1b/5a/1b1b5a1f-8635-8798-7215-2c2a4e0f7e1b/886446789012.jpg/400x400bb.jpg" },
  { name: "Shreya Ghoshal", genre: "Playback", img: "https://is1-ssl.mzstatic.com/image/thumb/Music122/v4/9a/8b/7c/9a8b7c6d-5e4f-3a2b-1c0d-9e8f7a6b5c4d/886446789013.jpg/400x400bb.jpg" },
  { name: "Sonu Nigam", genre: "Playback", img: "https://is1-ssl.mzstatic.com/image/thumb/Music112/v4/2c/3d/4e/2c3d4e5f-6a7b-8c9d-0e1f-2a3b4c5d6e7f/886446789014.jpg/400x400bb.jpg" },
  { name: "Lata Mangeshkar", genre: "Legend", img: "https://is1-ssl.mzstatic.com/image/thumb/Music122/v4/3d/4e/5f/3d4e5f6a-7b8c-9d0e-1f2a-3b4c5d6e7f8a/886446789015.jpg/400x400bb.jpg" }
];

function renderHome() {
  renderCardList(quickPicksData, "quickPicks");
  renderCardList(trendingData, "trendingSongs");
  
  const artistBox = document.getElementById("topArtists");
  artistBox.innerHTML = "";
  artistData.forEach(a => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="card-img-wrapper" style="border-radius: 50%;">
        <img src="${esc(a.img)}" style="border-radius: 50%;" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(a.name)}&background=1a2a5a&color=22d3ee'">
      </div>
      <h4 style="text-align:center;">${esc(a.name)}</h4>
      <p style="text-align:center;">${esc(a.genre)}</p>
    `;
    card.onclick = () => {
      document.getElementById("globalSearch").value = a.name;
      performSearch();
    };
    artistBox.appendChild(card);
  });
}

// INITIALIZE
renderHome();
loadYT();
</script>
</body>
</html>
