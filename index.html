<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>BlueWave Music - Pro</title>
<style>
  :root {
    --bg: #000; --surface: #121212; --surface-hover: #1f1f1f;
    --blue: #3b82f6; --cyan: #22d3ee; --text: #fff; --muted: #aaa; --line: #333;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
  body { background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 100px; }

  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
    display: flex; align-items: center; justify-content: space-between;
    padding: 15px 20px;
  }
  .logo { font-size: 22px; font-weight: 800; }
  .logo span { color: var(--cyan); }

  .search-bar {
    flex: 1; max-width: 500px; margin: 0 20px;
    display: flex; align-items: center; background: var(--surface);
    border-radius: 30px; padding: 8px 15px; border: 1px solid var(--line);
  }
  .search-bar input {
    flex: 1; background: transparent; border: none; color: #fff;
    font-size: 15px; outline: none; margin-left: 10px;
  }
  .search-bar button {
    background: var(--blue); border: none; color: #fff;
    padding: 8px 16px; border-radius: 20px; font-weight: bold; cursor: pointer;
  }

  main { max-width: 1200px; margin: 80px auto 0; padding: 0 20px; }
  .section-title { font-size: 20px; font-weight: 700; margin: 30px 0 15px; }

  .h-scroll { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 15px; scrollbar-width: none; }
  .h-scroll::-webkit-scrollbar { display: none; }

  .card {
    width: 160px; flex-shrink: 0; cursor: pointer;
    background: var(--surface); border-radius: 8px; padding: 10px;
    transition: transform 0.2s;
  }
  .card:hover { background: var(--surface-hover); transform: translateY(-3px); }
  .card-img-wrapper { position: relative; aspect-ratio: 1; margin-bottom: 10px; border-radius: 6px; overflow: hidden; background: #222; }
  .card img { width: 100%; height: 100%; object-fit: cover; }
  .card h4 { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
  .card p { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .play-overlay {
    position: absolute; bottom: 8px; right: 8px; width: 40px; height: 40px;
    background: var(--blue); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transform: translateY(10px);
    transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
  }
  .card:hover .play-overlay { opacity: 1; transform: translateY(0); }

  .song-list { display: flex; flex-direction: column; gap: 5px; }
  .song-row {
    display: flex; align-items: center; gap: 15px; padding: 10px;
    border-radius: 8px; cursor: pointer; transition: 0.2s;
  }
  .song-row:hover { background: var(--surface-hover); }
  .song-row.playing { background: rgba(59,130,246,0.15); border: 1px solid rgba(59,130,246,0.3); }
  .song-row img { width: 50px; height: 50px; border-radius: 5px; object-fit: cover; background: #222; }
  .song-info { flex: 1; min-width: 0; }
  .song-info h4 { font-size: 15px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song-info p { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .source-tag {
    display: inline-block; font-size: 10px; padding: 2px 6px;
    border-radius: 4px; margin-left: 6px;
    background: rgba(34,211,238,0.2); color: var(--cyan);
  }

  .action-btns { display: flex; gap: 10px; }
  .action-btns button, .action-btns a {
    background: transparent; border: none; color: var(--muted);
    font-size: 18px; cursor: pointer; text-decoration: none;
    transition: 0.2s;
  }
  .action-btns button:hover, .action-btns a:hover { color: #fff; transform: scale(1.1); }
  .action-btns .fav-btn.active { color: #ec4899; }

  .player-bar {
    position: fixed; bottom: 0; left: 0; right: 0; background: #181818;
    border-top: 1px solid var(--line); padding: 12px 20px;
    display: flex; align-items: center; justify-content: space-between; gap: 20px;
    z-index: 200; transform: translateY(100%); transition: transform 0.3s;
  }
  .player-bar.show { transform: translateY(0); }

  .player-left { display: flex; align-items: center; gap: 15px; width: 30%; min-width: 200px; }
  .player-left img { width: 50px; height: 50px; border-radius: 5px; object-fit: cover; background: #222; }
  .player-left h4 { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player-left p { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .player-center { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .controls { display: flex; align-items: center; gap: 20px; }
  .controls button { background: transparent; border: none; color: #fff; font-size: 20px; cursor: pointer; }
  .controls .play-main { background: #fff; color: #000; width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; }

  .progress-container { width: 100%; max-width: 500px; display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--muted); }
  .progress-track { flex: 1; height: 4px; background: #444; border-radius: 2px; cursor: pointer; position: relative; }
  .progress-fill { height: 100%; width: 0%; background: #fff; border-radius: 2px; }

  .player-right { width: 30%; display: flex; justify-content: flex-end; align-items: center; gap: 10px; }

  .spinner-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8);
    display: none; justify-content: center; align-items: center;
    z-index: 999; flex-direction: column; gap: 15px;
    color: var(--cyan); font-weight: bold;
  }
  .spinner { width: 40px; height: 40px; border: 4px solid rgba(85,229,255,0.3); border-top-color: var(--cyan); border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { 100% { transform: rotate(360deg); } }

  @media (max-width: 768px) {
    header { padding: 10px; flex-wrap: wrap; }
    .search-bar { margin: 10px 0 0; max-width: 100%; order: 3; width: 100%; }
    main { margin-top: 110px; padding: 0 15px; }
    .card { width: 130px; }
    .player-bar { flex-wrap: wrap; padding: 10px; gap: 10px; }
    .player-left { width: calc(100% - 150px); }
    .player-center { width: 100%; order: 3; }
    .player-right { width: 120px; }
  }
</style>
</head>
<body>

<div class="spinner-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <p>Server se connect ho raha hai...</p>
</div>

<header>
  <div class="logo">♪ BLUE<span>WAVE</span></div>
  <div class="search-bar">
    <span>🔍</span>
    <input id="globalSearch" type="text" placeholder="Search songs, artists...">
    <button onclick="performSearch()">Search</button>
  </div>
</header>

<main>
  <div id="searchSection" style="display: none; margin-top: 20px;">
    <h2 class="section-title">Search Results</h2>
    <div class="song-list" id="searchResults"></div>
  </div>

  <div id="homeSections">
    <h2 class="section-title">Quick picks</h2>
    <div class="h-scroll" id="quickPicks"></div>

    <h2 class="section-title">Trending songs for you</h2>
    <div class="h-scroll" id="trendingSongs"></div>

    <h2 class="section-title">Top Artists</h2>
    <div class="h-scroll" id="topArtists"></div>
  </div>
</main>

<div class="player-bar" id="playerBar">
  <div class="player-left">
    <!-- Fallback image added here -->
    <img id="playerImg" src="https://placehold.co/100x100/222/22d3ee?text=♪" alt="" onerror="this.src='https://placehold.co/100x100/222/22d3ee?text=♪'">
    <div>
      <h4 id="playerTitle">Song Title</h4>
      <p id="playerArtist">Artist Name</p>
    </div>
  </div>

  <div class="player-center">
    <div class="controls">
      <button id="prevBtn">⏮</button>
      <button id="playPauseBtn" class="play-main">▶</button>
      <button id="nextBtn">⏭</button>
    </div>
    <div class="progress-container">
      <span id="currentTime">0:00</span>
      <div class="progress-track" id="progressTrack"><div class="progress-fill" id="progressFill"></div></div>
      <span id="duration">0:00</span>
    </div>
  </div>

  <div class="player-right">
    <span>🔊</span>
    <input type="range" id="volumeBar" min="0" max="100" value="100" style="width: 80px; accent-color: white;">
  </div>
</div>

<div id="video-container" style="position:fixed; bottom:-9999px; left:-9999px; width:300px; height:300px;">
  <div id="ytPlayer"></div>
</div>

<audio id="audioPlayer"></audio>

<script>
const BACKEND_URL = "https://blue-wave-axyu.onrender.com";
const getData = (k, f) => { try { return JSON.parse(localStorage.getItem(k)) ?? f; } catch { return f; } };
const saveData = (k, v) => localStorage.setItem(k, JSON.stringify(v));
const esc = v => String(v||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));

// Fallback Image Function
const fallbackImg = "https://placehold.co/300x300/222/22d3ee?text=♪";

let songs = getData("mt_songs", []);
let favorites = getData("mt_favorites", []);
let queue = [];
let queueIdx = -1;
let playingId = null;
let isPlaying = false;
let ytPlayer = null, ytReady = false;
let progressTimer = null;
let pendingVideo = null;
let activeSource = "youtube"; 

const loadingOverlay = document.getElementById("loadingOverlay");
const audioEl = document.getElementById("audioPlayer");

function wakeUpServer() { fetch(BACKEND_URL).catch(()=>{}); }
wakeUpServer();
setInterval(wakeUpServer, 10 * 60 * 1000);

function loadYT() {
  if (window.YT && window.YT.Player) { onYTReady(); return; }
  const s = document.createElement("script");
  s.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(s);
}
window.onYouTubeIframeAPIReady = onYTReady;

function onYTReady() {
  if (ytPlayer) return;
  ytPlayer = new YT.Player("ytPlayer", {
    height: "300", width: "300",
    playerVars: { autoplay: 0, controls: 1, origin: window.location.origin, enablejsapi: 1 },
    events: {
      onReady: () => {
        ytReady = true;
        if (pendingVideo && pendingVideo.source === "youtube") {
          playYouTube(pendingVideo.videoId, pendingVideo.title, pendingVideo.artist, pendingVideo.thumbnail);
          pendingVideo = null;
        }
      },
      onStateChange: (e) => {
        if (e.data === YT.PlayerState.ENDED) playNext();
        if (e.data === YT.PlayerState.PLAYING) {
          isPlaying = true;
          document.getElementById("playPauseBtn").textContent = "⏸";
          startProgress();
        }
        if (e.data === YT.PlayerState.PAUSED) {
          isPlaying = false;
          document.getElementById("playPauseBtn").textContent = "▶";
        }
      }
    }
  });
}

function startProgress() {
  clearInterval(progressTimer);
  progressTimer = setInterval(() => {
    let cur = 0, dur = 0;
    if (activeSource === "youtube" && ytPlayer && ytReady && ytPlayer.getCurrentTime) {
      cur = ytPlayer.getCurrentTime() || 0;
      dur = ytPlayer.getDuration() || 0;
    } else if (activeSource === "deezer") {
      cur = audioEl.currentTime || 0;
      dur = audioEl.duration || 0;
    }
    document.getElementById("currentTime").textContent = fmt(cur);
    document.getElementById("duration").textContent = fmt(dur);
    if (dur > 0) document.getElementById("progressFill").style.width = (cur / dur * 100) + "%";
  }, 500);
}
function fmt(s) { if (!s || isNaN(s)) return "0:00"; const m = Math.floor(s/60), sec = Math.floor(s%60); return m + ":" + (sec < 10 ? "0" : "") + sec; }

function playYouTube(videoId, title, artist, thumbnail) {
  if (!ytPlayer || !ytReady) {
    pendingVideo = { videoId, title, artist, thumbnail, source: "youtube" };
    loadYT();
    return;
  }
  activeSource = "youtube";
  audioEl.pause();
  document.getElementById("playerTitle").textContent = title;
  document.getElementById("playerArtist").textContent = artist;
  document.getElementById("playerImg").src = thumbnail || fallbackImg;
  document.getElementById("playerBar").classList.add("show");

  ytPlayer.loadVideoById(videoId);
  playingId = videoId;
  markPlayingRow(videoId);
}

function playDeezer(previewUrl, title, artist, thumbnail, id) {
  activeSource = "deezer";
  if (ytPlayer && ytReady) ytPlayer.stopVideo();

  document.getElementById("playerTitle").textContent = title;
  document.getElementById("playerArtist").textContent = artist + " (Preview)";
  document.getElementById("playerImg").src = thumbnail || fallbackImg;
  document.getElementById("playerBar").classList.add("show");

  audioEl.src = previewUrl;
  audioEl.play().then(() => {
    isPlaying = true;
    document.getElementById("playPauseBtn").textContent = "⏸";
    startProgress();
  }).catch(err => alert("Audio play nahi ho paya: " + err.message));

  playingId = id;
  markPlayingRow(id);
}

audioEl.addEventListener("ended", () => playNext());

function markPlayingRow(id) {
  document.querySelectorAll(".song-row").forEach(el => {
    el.classList.toggle("playing", el.dataset.id === id);
  });
}

document.getElementById("playPauseBtn").onclick = () => {
  if (activeSource === "youtube") {
    if (!ytPlayer || !ytReady) return;
    if (isPlaying) ytPlayer.pauseVideo(); else ytPlayer.playVideo();
  } else {
    if (audioEl.paused) audioEl.play().then(() => {
      isPlaying = true;
      document.getElementById("playPauseBtn").textContent = "⏸";
    });
    else {
      audioEl.pause();
      isPlaying = false;
      document.getElementById("playPauseBtn").textContent = "▶";
    }
  }
};

document.getElementById("nextBtn").onclick = () => playNext();
document.getElementById("prevBtn").onclick = () => {
  if (!queue.length) return;
  queueIdx = (queueIdx - 1 + queue.length) % queue.length;
  playCurrentQueueItem();
};

function playCurrentQueueItem() {
  const s = queue[queueIdx];
  if (!s) return;
  if (s.source === "deezer" || s.previewUrl) {
    playDeezer(s.previewUrl, s.trackName, s.artistName, s.artworkUrl100, s.videoId);
  } else {
    playYouTube(s.videoId, s.trackName, s.artistName, s.artworkUrl100);
  }
}

function playNext() {
  if (!queue.length) return;
  queueIdx = (queueIdx + 1) % queue.length;
  playCurrentQueueItem();
}

document.getElementById("progressTrack").onclick = (e) => {
  const rect = e.currentTarget.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;

  if (activeSource === "youtube" && ytPlayer && ytReady) {
    ytPlayer.seekTo(pct * ytPlayer.getDuration(), true);
  } else if (activeSource === "deezer" && audioEl.duration) {
    audioEl.currentTime = pct * audioEl.duration;
  }
};
document.getElementById("volumeBar").oninput = (e) => {
  if (ytPlayer && ytReady) ytPlayer.setVolume(e.target.value);
  audioEl.volume = e.target.value / 100;
};

async function performSearch() {
  const q = document.getElementById("globalSearch").value.trim();
  if (!q) return;

  loadingOverlay.style.display = "flex";
  document.getElementById("homeSections").style.display = "none";
  document.getElementById("searchSection").style.display = "block";

  try {
    const res = await fetch(`${BACKEND_URL}/api/search?q=${encodeURIComponent(q)}`);
    const data = await res.json();

    loadingOverlay.style.display = "none";

    if (!data.results || !data.results.length) {
      document.getElementById("searchResults").innerHTML = '<div style="color:#aaa; padding:20px;">No results found.</div>';
      return;
    }

    const mapped = data.results.map(r => ({
      videoId: r.videoId,
      trackName: r.title,
      artistName: r.channel,
      artworkUrl100: r.thumbnail || fallbackImg, // Fallback image use kiya
      previewUrl: r.previewUrl || null,
      source: r.source || "youtube"
    }));

    queue = mapped;
    renderList(mapped, "searchResults");
  } catch (e) {
    loadingOverlay.style.display = "none";
    alert("Search failed. Server so raha hai, thodi der baad try karein.");
  }
}

// RENDER LIST WITH IMAGE ERROR HANDLING
function renderList(list, containerId) {
  const box = document.getElementById(containerId);
  box.innerHTML = "";
  list.forEach((s, i) => {
    const id = s.videoId;
    const isFav = favorites.includes(id);
    const dlUrl = `https://pagalworld.is/search?q=${encodeURIComponent(s.trackName)}`;

    const row = document.createElement("div");
    row.className = "song-row" + (playingId === id ? " playing" : "");
    row.dataset.id = id;
    row.innerHTML = `
      <img src="${esc(s.artworkUrl100)}" alt="" onerror="this.src='${fallbackImg}'">
      <div class="song-info">
        <h4>${esc(s.trackName)} <span class="source-tag">${esc(s.source.toUpperCase())}</span></h4>
        <p>${esc(s.artistName)}</p>
      </div>
      <div class="action-btns">
        <button class="fav-btn ${isFav ? 'active' : ''}">${isFav ? '❤️' : '🤍'}</button>
        <a href="${dlUrl}" target="_blank">⬇</a>
      </div>
    `;
    row.querySelector(".fav-btn").onclick = (e) => {
      e.stopPropagation();
      if (favorites.includes(id)) favorites = favorites.filter(x => x !== id);
      else favorites.push(id);
      saveData("mt_favorites", favorites);
      renderList(list, containerId);
    };
    row.onclick = () => {
      queue = list;
      queueIdx = i;
      playCurrentQueueItem();
    };
    box.appendChild(row);
  });
}

// RENDER CARDS WITH IMAGE ERROR HANDLING
function renderCardList(list, containerId) {
  const box = document.getElementById(containerId);
  box.innerHTML = "";
  list.forEach((s, i) => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="card-img-wrapper">
        <img src="${esc(s.artworkUrl100)}" alt="" onerror="this.src='${fallbackImg}'">
        <div class="play-overlay">▶</div>
      </div>
      <h4>${esc(s.trackName)}</h4>
      <p>${esc(s.artistName)}</p>
    `;
    card.onclick = () => {
      queue = list;
      queueIdx = i;
      playCurrentQueueItem();
    };
    box.appendChild(card);
  });
}

// FIXED HOME DATA WITH WORKING IMAGES
const quickPicksData = [
  { videoId: "Umqb9KENgmk", trackName: "Mere Mehboob", artistName: "KID Boi", artworkUrl100: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=300&h=300&fit=crop", source: "youtube" },
  { videoId: "BddP6PYo2gs", trackName: "Shiv Shiv Shankar", artistName: "Nikhar Juneja", artworkUrl100: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=300&h=300&fit=crop", source: "youtube" },
  { videoId: "7Ii7l6y7c3U", trackName: "Jai Bajrang", artistName: "Rapperiya Baalam", artworkUrl100: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300&h=300&fit=crop", source: "youtube" },
];

const trendingData = [
  { videoId: "284Ov7ysmfA", trackName: "Kanchi Keri", artistName: "Rapperiya Baalam", artworkUrl100: "https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=300&h=300&fit=crop", source: "youtube" },
  { videoId: "ElZfdU54Cp8", trackName: "So Swaag", artistName: "Yo Yo", artworkUrl100: "https://images.unsplash.com/photo-1516280440502-8638b02e11f1?w=300&h=300&fit=crop", source: "youtube" },
  { videoId: "BddP6PYo2gs", trackName: "Duvidha 2", artistName: "Allows Music", artworkUrl100: "https://images.unsplash.com/photo-1459749411175-04bf5292ceea?w=300&h=300&fit=crop", source: "youtube" },
];

const artistData = [
  { name: "Arijit Singh", genre: "Playback", img: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300&h=300&fit=crop" },
  { name: "Shreya Ghoshal", genre: "Playback", img: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=300&h=300&fit=crop" },
  { name: "Sonu Nigam", genre: "Playback", img: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=300&h=300&fit=crop" },
  { name: "Lata Mangeshkar", genre: "Legend", img: "https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=300&h=300&fit=crop" }
];

function renderHome() {
  renderCardList(quickPicksData, "quickPicks");
  renderCardList(trendingData, "trendingSongs");

  const artistBox = document.getElementById("topArtists");
  artistBox.innerHTML = "";
  artistData.forEach(a => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="card-img-wrapper" style="border-radius: 50%;">
        <img src="${esc(a.img)}" style="border-radius: 50%;" onerror="this.src='${fallbackImg}'">
      </div>
      <h4 style="text-align:center;">${esc(a.name)}</h4>
      <p style="text-align:center;">${esc(a.genre)}</p>
    `;
    card.onclick = () => {
      document.getElementById("globalSearch").value = a.name;
      performSearch();
    };
    artistBox.appendChild(card);
  });
}

renderHome();
loadYT();
</script>
</body>
</html>
