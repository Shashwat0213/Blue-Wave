<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>BlueWave Music - Ultimate</title>
<style>
  :root {
    --bg: #061126; --panel: rgba(13, 32, 64, 0.7); --blue: #168bff;
    --cyan: #55e5ff; --text: #f4f8ff; --muted: #a8bbd8; --line: rgba(36, 67, 107, 0.6); --glass: blur(12px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; position: relative; }
  body::before { content: ''; position: fixed; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle at 50% 50%, rgba(22,139,255,0.15) 0%, transparent 40%), radial-gradient(circle at 80% 20%, rgba(85,229,255,0.1) 0%, transparent 30%); animation: rotateBg 25s linear infinite; z-index: -1; }
  @keyframes rotateBg { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

  header { display: flex; justify-content: space-between; align-items: center; padding: 20px 5%; background: rgba(6, 17, 38, 0.8); backdrop-filter: var(--glass); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 50; }
  .logo { font-weight: 900; font-size: 24px; color: var(--cyan); display: flex; align-items: center; gap: 8px; }
  .logo span { color: var(--text); }
  
  main { max-width: 1300px; margin: auto; padding: 20px 5% 150px; }
  .section { margin-bottom: 40px; }
  .section-head { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
  .section-head h2 { font-size: 24px; font-weight: 800; background: linear-gradient(to right, #fff, var(--cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  
  .search-container { position: relative; max-width: 700px; margin: 20px auto 40px; }
  .search-container input { width: 100%; padding: 18px 24px; border-radius: 50px; background: var(--panel); border: 1px solid var(--line); color: #fff; font-size: 16px; outline: none; backdrop-filter: var(--glass); box-shadow: 0 4px 20px rgba(0,0,0,0.3); transition: 0.3s; }
  .search-container input:focus { border-color: var(--cyan); box-shadow: 0 0 15px rgba(85,229,255,0.2); }
  .search-container button { position: absolute; right: 8px; top: 8px; bottom: 8px; border-radius: 50px; padding: 0 25px; background: var(--blue); font-weight: bold; border: none; cursor: pointer; color: #fff; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; }
  .stat { background: var(--panel); backdrop-filter: var(--glass); border: 1px solid var(--line); border-radius: 16px; padding: 20px; text-align: center; }
  .stat h3 { color: var(--muted); font-size: 13px; margin-bottom: 8px; text-transform: uppercase; }
  .stat strong { font-size: 32px; color: var(--cyan); }

  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 20px; }
  .card { background: var(--panel); backdrop-filter: var(--glass); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; cursor: pointer; transition: 0.3s; }
  .card:hover { transform: translateY(-8px) scale(1.02); border-color: var(--cyan); }
  .card img { width: 100%; height: 200px; object-fit: cover; display: block; background: #0d2040; }
  .card .info { padding: 15px; text-align: center; }
  .card .info h3 { font-size: 16px; margin-bottom: 5px; }
  .card .info p { color: var(--muted); font-size: 12px; }

  .song-list { display: flex; flex-direction: column; gap: 10px; }
  .song { display: flex; align-items: center; gap: 15px; padding: 12px 15px; background: var(--panel); backdrop-filter: var(--glass); border: 1px solid var(--line); border-radius: 14px; transition: 0.2s; }
  .song:hover { transform: translateX(5px); border-color: rgba(85,229,255,0.5); }
  .song.playing { border-color: var(--cyan); background: rgba(85,229,255,0.15); }
  .song img { width: 60px; height: 60px; border-radius: 10px; object-fit: cover; background: #0d2040; }
  .song-info { flex: 1; min-width: 0; }
  .song-info h4 { font-size: 15px; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song-info p { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  
  .song-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .song-actions button, .song-actions a { padding: 8px 12px; border-radius: 8px; font-size: 14px; background: rgba(255,255,255,0.05); border: 1px solid var(--line); cursor: pointer; display: flex; justify-content: center; align-items: center; color: #fff; text-decoration: none;}
  .song-actions button:hover, .song-actions a:hover { background: var(--blue); border-color: var(--blue); }
  .song-actions .fav-btn.active { background: #ec4899; border-color: #ec4899; }
  .song-actions .download-btn { background: rgba(85, 229, 255, 0.1); color: var(--cyan); border-color: var(--cyan); }

  .empty { text-align: center; padding: 40px; color: var(--muted); border: 1px dashed var(--line); border-radius: 16px; background: var(--panel); }

  .player-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(6, 17, 38, 0.95); backdrop-filter: blur(20px); border-top: 1px solid var(--line); padding: 15px 5%; display: flex; align-items: center; gap: 20px; z-index: 100; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
  .player-bar.show { transform: translateY(0); }
  
  .player-info { display: flex; align-items: center; gap: 15px; min-width: 200px; max-width: 300px; }
  .player-info img { width: 55px; height: 55px; border-radius: 10px; object-fit: cover; }
  .player-info h4 { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player-info p { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .player-controls { display: flex; align-items: center; gap: 15px; }
  .player-controls button { background: transparent; border: none; color: #fff; font-size: 20px; cursor: pointer; }
  .player-controls .play-main { background: var(--blue); width: 50px; height: 50px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 22px; }

  .player-progress { flex: 1; display: flex; align-items: center; gap: 12px; }
  .progress-track { flex: 1; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; cursor: pointer; }
  .progress-fill { height: 100%; width: 0%; background: var(--cyan); border-radius: 3px; }

  .spinner-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 999; flex-direction: column; gap: 15px; color: var(--cyan); font-weight: bold;}
  .spinner { width: 40px; height: 40px; border: 4px solid rgba(85,229,255,0.3); border-top-color: var(--cyan); border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { 100% { transform: rotate(360deg); } }

  @media (max-width: 768px) {
    .player-bar { flex-wrap: wrap; padding: 10px; gap: 10px; }
    .player-info { width: calc(100% - 180px); }
    .player-progress { width: 100%; order: 4; }
    .song-actions { width: 100%; justify-content: space-between; margin-top: 10px; }
    .song-actions button, .song-actions a { flex: 1; justify-content: center; }
    .card img { height: 150px; }
  }
</style>
</head>
<body>

<div class="spinner-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <p id="loadingText">Backend Server jag raha hai...</p>
</div>

<header>
  <div class="logo">🎵 BLUE<span>WAVE</span></div>
  <div style="font-size: 12px; color: var(--cyan); border: 1px solid var(--cyan); padding: 5px 12px; border-radius: 20px;">ULTIMATE PRO</div>
</header>

<main>
  <div class="search-container">
    <input id="globalSearch" type="text" placeholder="Search any song, artist...">
    <button onclick="performSearch()">Search</button>
  </div>

  <section class="section">
    <div class="stats">
      <div class="stat"><h3>Library</h3><strong id="total">0</strong></div>
      <div class="stat"><h3>Listened</h3><strong id="listened">0</strong></div>
      <div class="stat"><h3>Favorites</h3><strong id="favCount">0</strong></div>
      <div class="stat"><h3>Playlists</h3><strong id="plCount">0</strong></div>
    </div>
  </section>

  <section class="section" id="searchSection" style="display:none;">
    <div class="section-head"><h2>🔍 Search Results</h2><button class="btn btn-outline" onclick="closeSearch()">Close</button></div>
    <div class="song-list" id="searchResults"></div>
  </section>

  <section class="section">
    <div class="section-head"><h2>🔥 Top Artists</h2></div>
    <div class="gallery" id="artists"></div>
  </section>
</main>

<div class="player-bar" id="playerBar">
  <div class="player-info">
    <img id="playerImg" src="https://placehold.co/100x100/1c2542/22d3ee?text=♪" alt="">
    <div><h4 id="playerTitle">Nothing playing</h4><p id="playerArtist">—</p></div>
  </div>
  <div class="player-controls">
    <button id="prevBtn">⏮</button>
    <button id="playPauseBtn" class="play-main">▶</button>
    <button id="nextBtn">⏭</button>
  </div>
  <div class="player-progress">
    <span id="currentTime">0:00</span>
    <div class="progress-track" id="progressTrack"><div class="progress-fill" id="progressFill"></div></div>
    <span id="duration">0:00</span>
  </div>
</div>

<div id="video-container" style="position:fixed; bottom:-9999px; left:-9999px; width:300px; height:300px;">
  <div id="ytPlayer"></div>
</div>

<script>
const BACKEND_URL = "https://blue-wave-axyu.onrender.com"; 
const getData = (k, f) => { try { return JSON.parse(localStorage.getItem(k)) ?? f; } catch { return f; } };
const saveData = (k, v) => localStorage.setItem(k, JSON.stringify(v));
const esc = v => String(v||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));

let songs = getData("mt_songs", []);
let favorites = getData("mt_favorites", []);
let playlists = getData("mt_playlists", []);

let queue = [];
let queueIdx = -1;
let playingId = null;
let isPlaying = false;
let ytPlayer = null, ytReady = false;
let progressTimer = null;
let pendingVideo = null; 

const loadingOverlay = document.getElementById("loadingOverlay");
const loadingText = document.getElementById("loadingText");

function loadYT() {
  if (window.YT && window.YT.Player) { onYTReady(); return; }
  const s = document.createElement("script");
  s.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(s);
}
window.onYouTubeIframeAPIReady = onYTReady;

function onYTReady() {
  if(ytPlayer) return;
  ytPlayer = new YT.Player("ytPlayer", {
    height: "300", width: "300",
    playerVars: { autoplay: 0, controls: 1, origin: window.location.origin, enablejsapi: 1 },
    events: {
      onReady: () => { 
        ytReady = true; 
        if (pendingVideo) { playVideo(pendingVideo.videoId, pendingVideo.title, pendingVideo.artist, pendingVideo.thumbnail); pendingVideo = null; }
      },
      onStateChange: (e) => {
        if (e.data === YT.PlayerState.ENDED) { playNext(); }
        if (e.data === YT.PlayerState.PLAYING) {
          isPlaying = true;
          document.getElementById("playPauseBtn").textContent = "⏸";
          startProgress();
        }
        if (e.data === YT.PlayerState.PAUSED) {
          isPlaying = false;
          document.getElementById("playPauseBtn").textContent = "▶";
        }
      }
    }
  });
}

function startProgress() {
  clearInterval(progressTimer);
  progressTimer = setInterval(() => {
    if (!ytPlayer || !ytReady || !ytPlayer.getCurrentTime) return;
    const cur = ytPlayer.getCurrentTime() || 0;
    const dur = ytPlayer.getDuration() || 0;
    document.getElementById("currentTime").textContent = fmt(cur);
    document.getElementById("duration").textContent = fmt(dur);
    if (dur > 0) document.getElementById("progressFill").style.width = (cur / dur * 100) + "%";
  }, 500);
}
function fmt(s) { if (!s || isNaN(s)) return "0:00"; const m = Math.floor(s/60), sec = Math.floor(s%60); return m + ":" + (sec < 10 ? "0" : "") + sec; }

async function playVideo(videoId, title, artist, thumbnail) {
  if (!ytPlayer || !ytReady) {
    pendingVideo = { videoId, title, artist, thumbnail };
    loadYT(); return;
  }
  document.getElementById("playerTitle").textContent = title;
  document.getElementById("playerArtist").textContent = artist;
  document.getElementById("playerImg").src = thumbnail || "https://placehold.co/100x100/1c2542/22d3ee?text=♪";
  document.getElementById("playerBar").classList.add("show");
  
  ytPlayer.loadVideoById(videoId);
  playingId = videoId;
  document.querySelectorAll(".song").forEach(el => el.classList.toggle("playing", el.dataset.id === videoId));
}

document.getElementById("playPauseBtn").onclick = () => {
  if (!ytPlayer || !ytReady) return;
  if (isPlaying) ytPlayer.pauseVideo(); else ytPlayer.playVideo();
};
document.getElementById("nextBtn").onclick = () => playNext();
document.getElementById("prevBtn").onclick = () => {
  if (!queue.length) return; queueIdx = (queueIdx - 1 + queue.length) % queue.length;
  const s = queue[queueIdx]; playVideo(s.videoId, s.trackName || s.name, s.artistName || s.artist, s.artworkUrl100 || s.image);
};
function playNext() {
  if (!queue.length) return; queueIdx = (queueIdx + 1) % queue.length;
  const s = queue[queueIdx]; playVideo(s.videoId, s.trackName || s.name, s.artistName || s.artist, s.artworkUrl100 || s.image);
}

async function performSearch() {
  const q = document.getElementById("globalSearch").value.trim();
  if (!q) return;
  
  loadingOverlay.style.display = "flex";
  loadingText.textContent = "Searching... (Backend wake up ho raha hai)";

  try {
    await fetch(BACKEND_URL).catch(()=>{});
    const res = await fetch(`${BACKEND_URL}/api/search?q=${encodeURIComponent(q)}`);
    const data = await res.json();
    
    loadingOverlay.style.display = "none";
    document.getElementById("searchSection").style.display = "block";

    if (!data.results || !data.results.length) {
      document.getElementById("searchResults").innerHTML = '<div class="empty">No results found.</div>'; return;
    }

    const mapped = data.results.map(r => ({ videoId: r.videoId, trackName: r.title, artistName: r.channel, artworkUrl100: r.thumbnail }));
    queue = mapped;
    renderSongList(mapped, "searchResults");
    document.getElementById("searchSection").scrollIntoView({ behavior: "smooth" });
  } catch (e) {
    loadingOverlay.style.display = "none";
    alert("Search failed. Server so raha hai, 1 minute baad try karein.");
  }
}

function renderSongList(list, containerId) {
  const box = document.getElementById(containerId);
  box.innerHTML = "";
  list.forEach((s, i) => {
    const id = s.videoId;
    const isFav = favorites.includes(id);
    const dlUrl = `https://pagalworld.is/search?q=${encodeURIComponent(s.trackName)}`;
    
    const row = document.createElement("div");
    row.className = "song" + (playingId === id ? " playing" : "");
    row.dataset.id = id;
    row.innerHTML = `
      <img src="${esc(s.artworkUrl100)}" alt="">
      <div class="song-info"><h4>${esc(s.trackName)}</h4><p>${esc(s.artistName)}</p></div>
      <div class="song-actions">
        <button class="play-btn">▶</button>
        <button class="fav-btn ${isFav ? 'active' : ''}">${isFav ? '❤️' : '♡'}</button>
        <a href="${dlUrl}" target="_blank" class="download-btn">⬇</a>
      </div>
    `;
    row.querySelector(".play-btn").onclick = () => {
      queue = list; queueIdx = i; playVideo(s.videoId, s.trackName, s.artistName, s.artworkUrl100);
    };
    row.querySelector(".fav-btn").onclick = () => {
      if(favorites.includes(id)) favorites = favorites.filter(x => x !== id);
      else favorites.push(id);
      saveData("mt_favorites", favorites); renderSongList(list, containerId); updateDashboard();
    };
    box.appendChild(row);
  });
}

const featuredArtists = [
  { name: "Arijit Singh", genre: "Playback", img: "https://is1-ssl.mzstatic.com/image/thumb/Music112/v4/1b/1b/5a/1b1b5a1f-8635-8798-7215-2c2a4e0f7e1b/886446789012.jpg/400x400bb.jpg" },
  { name: "Shreya Ghoshal", genre: "Playback", img: "https://is1-ssl.mzstatic.com/image/thumb/Music122/v4/9a/8b/7c/9a8b7c6d-5e4f-3a2b-1c0d-9e8f7a6b5c4d/886446789013.jpg/400x400bb.jpg" },
  { name: "Sonu Nigam", genre: "Playback", img: "https://is1-ssl.mzstatic.com/image/thumb/Music112/v4/2c/3d/4e/2c3d4e5f-6a7b-8c9d-0e1f-2a3b4c5d6e7f/886446789014.jpg/400x400bb.jpg" }
];

function renderArtists() {
  document.getElementById("artists").innerHTML = featuredArtists.map(a => `
    <article class="card" onclick="loadArtistSongs('${esc(a.name)}')">
      <img src="${esc(a.img)}" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(a.name)}&background=1a2a5a&color=22d3ee'">
      <div class="info"><h3>${esc(a.name)}</h3><p>${esc(a.genre)}</p></div>
    </article>
  `).join("");
}

async function loadArtistSongs(artistName) {
  document.getElementById("globalSearch").value = artistName;
  performSearch();
}

function closeSearch() { document.getElementById("searchSection").style.display = "none"; }

function updateDashboard() { document.getElementById("favCount").textContent = favorites.length; }

renderArtists();
updateDashboard();
loadYT();
</script>
</body>
</html>
